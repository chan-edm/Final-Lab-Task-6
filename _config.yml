<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EDM PORTFOLIO OF Christian S. Boiles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      overflow-x: hidden;
      position: relative;
      animation: glowingBackground 10s ease-in-out infinite;
    }

    @keyframes glowingBackground {
      0% {
        background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #00ff00, #00d4ff, #8a00d4, #ff0000);
      }
      14% {
        background: linear-gradient(45deg, #ff7300, #fffb00, #00ff00, #00d4ff, #8a00d4, #ff0000, #ff7300);
      }
      28% {
        background: linear-gradient(45deg, #fffb00, #00ff00, #00d4ff, #8a00d4, #ff0000, #ff7300, #fffb00);
      }
      42% {
        background: linear-gradient(45deg, #00ff00, #00d4ff, #8a00d4, #ff0000, #ff7300, #fffb00, #00ff00);
      }
      57% {
        background: linear-gradient(45deg, #00d4ff, #8a00d4, #ff0000, #ff7300, #fffb00, #00ff00, #00d4ff);
      }
      71% {
        background: linear-gradient(45deg, #8a00d4, #ff0000, #ff7300, #fffb00, #00ff00, #00d4ff, #8a00d4);
      }
      85% {
        background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #00ff00, #00d4ff, #8a00d4, #ff0000);
      }
      100% {
        background: linear-gradient(45deg, #ff7300, #fffb00, #00ff00, #00d4ff, #8a00d4, #ff0000, #ff7300);
      }
    }

    header, section, footer {
      padding: 60px 20px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s forwards;
    }

    header { animation-delay: 0.2s; }
    #about { animation-delay: 0.5s; }
    #projects { animation-delay: 0.6s; }
    #contact { animation-delay: 0.8s; }
    footer { animation-delay: 1s; }

    h1 {
      font-size: 4.5em;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      margin-bottom: 10px;
      color: #00ff99;
      text-shadow: 0px 0px 10px rgba(0, 255, 153, 0.7);
    }

    h2 {
      font-size: 2.5em;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 20px;
    }

    .typing {
      font-size: 1.5em;
      color: #00ff99;
      height: 30px;
      margin-bottom: 30px;
      font-family: 'Roboto Mono', monospace;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #00ff99;
      color: #000;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 1em;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 0 10px #00ff99;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #00cc7a;
      box-shadow: 0 0 15px #00cc7a;
    }

    footer {
      font-size: 0.8em;
      color: #777;
      font-family: 'Poppins', sans-serif;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li a {
      color: #00ff99;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
    }

    ul li a:hover {
      color: #ffffff;
      text-shadow: 0 0 5px #00ff99, 0 0 10px #00ff99, 0 0 20px #00ff99;
    }

    ul li a:focus,
    ul li a:active {
      color: #ffffff;
      text-shadow: 0 0 5px #00ff99, 0 0 10px #00ff99;
    }

    a.clicked {
      background-color: #00ff99;
      color: #000;
      box-shadow: 0 0 15px #00ff99;
      border-radius: 5px;
    }

    section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      margin: 20px auto;
      padding: 40px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.1);
    }

    header {
      position: relative;
      background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
      border-radius: 10px;
      padding: 80px 20px;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

